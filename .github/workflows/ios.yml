# File: .github/workflows/ios.yml
name: ios
# The game for iPhone and iPad, and nothing else: the Rust game cross-compiled for aarch64-apple-ios, wrapped by
# packaging/ios/project.yml's HorizonGame target, and uploaded as an unsigned .ipa.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an unsigned release (main branch only)
        type: boolean
        default: false
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  HORIZON_MSA_CLIENT_ID: "331e08f8-172d-43b9-835a-3108c2fcdbf3"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  ipa:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-26-intel' || vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the Apple toolchain
        run: bash tools/ci/ios-toolchain.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_TARGET }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
      - name: Build the game
        run: cargo build --release --locked --target "$IOS_TARGET" -p horizon-official --no-default-features --features audio,horizon-extras
      - name: Bundle it
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-game-build.log 2>&1 || { tail -60 xcode-game-build.log; exit 1; }
          python3 tools/ci/ios_release.py --stamp-app build-ios/HorizonGame.app \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expect-commit "$GITHUB_SHA" --client-id "$HORIZON_MSA_CLIENT_ID"
          rm -rf game-xcode && mkdir -p game-xcode/Payload
          cp -a build-ios/HorizonGame.app game-xcode/Payload/
          ( cd game-xcode && zip -qry ../Horizon-game-unsigned.ipa Payload )
      - name: Preserve the Xcode failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-failure-log
          path: xcode-game-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Audit the unsigned distributable
        run: python3 tools/ci/ios_release.py Horizon-game-unsigned.ipa --expect-commit "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game
          path: Horizon-game-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Publish on the ios-nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          {
            echo "## Horizon iOS + Raven bS+ ClickGUI — direct unsigned .ipa"
            echo
            echo "**Commit:** \`${COMMIT}\` (\`${REF_NAME}\`, $date)"
            echo
            echo "Télécharge directement \`Horizon-game-unsigned.ipa\` ci-dessous (pas de .zip) et signe-le avec ZeeSigner."
          } > notes.md
          gh release delete ios-nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-nightly --prerelease --latest=false --target "${GITHUB_REF_NAME}" \
            --title "iOS Nightly Raven · $date · ${COMMIT:0:7}" \
            --notes-file notes.md \
            Horizon-game-unsigned.ipa

  release:
    needs: ipa
    if: >-
      github.repository == 'Azertqr/a-bit-better-horizon-ios' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: horizon-ios-game
          path: ipa-artifact
      - name: Prepare versioned IPA and checksum
        id: asset
        run: |
          python3 tools/ci/ios_release.py ipa-artifact/Horizon-game-unsigned.ipa \
            --expect-commit "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" --output-dir release-assets >> "$GITHUB_OUTPUT"
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA: ${{ steps.asset.outputs.ipa }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
          VERSION: ${{ steps.asset.outputs.version }}
          BUILD: ${{ steps.asset.outputs.build }}
        run: bash tools/ci/publish-ios-release.sh
